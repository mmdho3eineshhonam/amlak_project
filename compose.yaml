services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amlak
      POSTGRES_USER: amlak
      POSTGRES_PASSWORD: amlak
    ports:
      - "5433:5432"
    volumes:
      - amlak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amlak -d amlak"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      POSTGRES_DB: amlak
      POSTGRES_USER: amlak
      POSTGRES_PASSWORD: amlak
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  amlak_postgres_data:
